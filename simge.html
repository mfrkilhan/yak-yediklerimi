<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f47b20">
<title>Yediklerimi Yak – Simge Oluşturucu</title>
<style>
body{font-family:Arial,sans-serif;background:#fff7ef;color:#29231f;max-width:650px;margin:30px auto;padding:20px;text-align:center}
main{background:white;border:2px solid #f3d2b8;border-radius:20px;padding:24px}
h1{color:#71320b}canvas{width:180px;height:180px;max-width:70%;border-radius:24px;background:#f47b20}
button{display:block;width:100%;padding:14px;margin:12px 0;border:0;border-radius:12px;background:#f47b20;color:white;font-size:17px;font-weight:bold;cursor:pointer}
p{line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🍟 Yediklerimi Yak</h1>
<p>Uygulamanın simgelerini aşağıdaki düğmelerle ayrı ayrı indir. Üç dosyayı da GitHub deponun ana klasörüne yükle.</p>
<canvas id="preview" width="512" height="512" aria-label="Turuncu zemin üzerinde patates kızartması simgesi"></canvas>
<button onclick="downloadIcon(192,'icon-192.png')">192 × 192 simgesini indir</button>
<button onclick="downloadIcon(512,'icon-512.png')">512 × 512 simgesini indir</button>
<button onclick="downloadIcon(180,'apple-touch-icon.png')">180 × 180 Apple simgesini indir</button>
<p id="status" role="status">İndirme düğmelerine sırayla bas.</p>
</main>
<script>
function draw(size){
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const x=c.getContext('2d');
  x.fillStyle='#f47b20'; x.fillRect(0,0,size,size);
  x.textAlign='center'; x.textBaseline='middle';
  x.font=`${Math.round(size*.68)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  x.fillText('🍟',size/2,size*.53);
  return c;
}
const preview=document.getElementById('preview');
preview.getContext('2d').drawImage(draw(512),0,0);
function downloadIcon(size,name){
  const c=draw(size);
  c.toBlob(blob=>{
    if(!blob){document.getElementById('status').textContent='Simge oluşturulamadı. Tekrar deneyin.';return;}
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    document.getElementById('status').textContent=name+' indirildi.';
  },'image/png');
}
</script>
</body>
</html>
